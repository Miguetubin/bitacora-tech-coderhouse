{% extends 'base.html' %}
{% block title %}Eliminar publicación · Bitácora Tech{% endblock %}
{% block content %}<section class="form-panel"><p class="eyebrow">ELIMINAR PUBLICACIÓN</p><h1>¿Eliminar esta idea?</h1><p>Vas a eliminar “<strong>{{ post.title }}</strong>”. Esta acción no se puede deshacer.</p><form method="post">{% csrf_token %}<div class="actions"><button type="submit" class="button danger">Sí, eliminar</button><a class="button secondary" href="{{ post.get_absolute_url }}">Cancelar</a></div></form></section>{% endblock %}
